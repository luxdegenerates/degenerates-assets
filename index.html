<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>DEGENERATES</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./degenerates-icon-180.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./degenerates-icon-192.png"
  >

  <link rel="manifest" href="./manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DEGENERATES">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080b0d">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #080b0d;
      color: #f5f7f8;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(28px, env(safe-area-inset-top))
        24px
        max(28px, env(safe-area-inset-bottom));
    }

    .card {
      width: min(420px, 100%);
      text-align: center;
    }

    .logo {
      width: 132px;
      height: 132px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    h1 {
      margin: 24px 0 8px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    p {
      margin: 0 auto 24px;
      max-width: 330px;
      color: #8d949f;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px 18px;

      border: 0;
      border-radius: 12px;

      background: #43e383;
      color: #07110b;

      font-size: 14px;
      font-weight: 900;
      letter-spacing: .6px;

      cursor: pointer;
    }

    .small {
      margin-top: 18px;
      color: #666e79;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="./degenerates-icon-512.png"
      alt="DEGENERATES"
    >

    <h1>DEGENERATES</h1>

    <p id="message">
      Add this page to your Home Screen. When opened from the Home Screen,
      it will launch the DEGENERATES app.
    </p>

    <button id="openButton" type="button">
      OPEN DEGENERATES
    </button>

    <div class="small">
      Luxembourg football betting league
    </div>

  </main>


  <script>
    /*
      IMPORTANT:
      Replace ONLY the URL below with your complete live Apps Script /exec URL.
    */
    const DEGENERATES_APP_URL =
      'PASTE_YOUR_COMPLETE_APPS_SCRIPT_EXEC_URL_HERE';


    function appUrlConfigured() {
      return (
        DEGENERATES_APP_URL.startsWith('https://') &&
        !DEGENERATES_APP_URL.includes('PASTE_YOUR_')
      );
    }


    function openDegenerates() {
      if (!appUrlConfigured()) {
        alert(
          'Edit index.html on GitHub and paste the complete Apps Script /exec URL into DEGENERATES_APP_URL.'
        );
        return;
      }

      window.location.replace(
        DEGENERATES_APP_URL
      );
    }


    const launchedFromHomeScreen =
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||
      window.navigator.standalone === true;


    if (
      launchedFromHomeScreen &&
      appUrlConfigured()
    ) {
      document.getElementById(
        'message'
      ).textContent =
        'Opening DEGENERATES…';

      document.getElementById(
        'openButton'
      ).style.display =
        'none';

      setTimeout(
        openDegenerates,
        120
      );
    }


    document.getElementById(
      'openButton'
    ).addEventListener(
      'click',
      openDegenerates
    );
  </script>

</body>
</html>
